<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0505"/><stop offset="55%" stop-color="#1a0909"/><stop offset="100%" stop-color="#0b0505"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb800"/><stop offset="100%" stop-color="#ffd37a"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8ff"/><stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSm" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="fr"><rect width="900" height="560" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#fr)">
    <rect width="900" height="560" fill="url(#bg)"/>

    <!-- title strip -->
    <text x="30" y="34" font-family="Consolas,monospace" font-size="13" fill="#ff5c5c" letter-spacing="2" filter="url(#glowSm)">
      ⚠ ATTACK SURFACE EXPANDED — DAY 02 BASELINE
      <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
    </text>

    <!-- scrolling exposure ticker -->
    <text font-family="Consolas,monospace" font-size="11.5" fill="#ffb800" letter-spacing="1.5">
      <animate attributeName="x" values="900;-780" dur="10s" repeatCount="indefinite"/>
      <tspan y="60">scan: SMBv1 open :445 :: anonymous FTP :21 :: share \\OXA-DC01\Finance = Everyone:FullControl :: Defender OFF :: Firewall OFF :: lockout threshold = 0</tspan>
    </text>

    <!-- grid -->
    <g stroke="#ff3b3b" stroke-width="1" opacity="0.3">
      <line x1="450" y1="260" x2="20" y2="500"/><line x1="450" y1="260" x2="210" y2="500"/>
      <line x1="450" y1="260" x2="450" y2="500"/><line x1="450" y1="260" x2="690" y2="500"/><line x1="450" y1="260" x2="880" y2="500"/>
    </g>

    <!-- connections -->
    <path id="p-dc" d="M 230,160 C 320,220 360,250 440,300" stroke="#5a1a1a" stroke-width="2.4" fill="none"/>
    <path id="p-win" d="M 670,160 C 580,220 540,250 460,300" stroke="#0a4a3a" stroke-width="2.4" fill="none"/>
    <path id="p-kali" d="M 450,330 C 450,370 450,390 450,430" stroke="#ff3b3b" stroke-width="2.2" stroke-dasharray="4 4" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;16" dur="0.7s" repeatCount="indefinite"/>
    </path>

    <!-- red recon pulses toward DC (exposure traffic) -->
    <circle r="4.5" fill="#ff3b3b" filter="url(#glow)">
      <animateMotion dur="1.3s" repeatCount="indefinite"><mpath href="#p-dc"/></animateMotion>
    </circle>
    <circle r="3" fill="#ffb800" filter="url(#glowSm)" opacity="0.85">
      <animateMotion dur="1.3s" begin="0.4s" repeatCount="indefinite"><mpath href="#p-dc"/></animateMotion>
    </circle>

    <circle r="4" fill="#00c8ff" filter="url(#glowSm)">
      <animateMotion dur="2.3s" repeatCount="indefinite"><mpath href="#p-win"/></animateMotion>
    </circle>

    <!-- kali -> dc scanning pulse (foreshadow) -->
    <circle r="4.5" fill="#ff3b3b" filter="url(#glow)">
      <animateMotion dur="1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" path="M 450,330 C 450,370 450,390 450,430"/>
    </circle>

    <!-- Switch -->
    <g transform="translate(450,315)">
      <circle r="36" fill="#1a0909" stroke="#ff3b3b" stroke-width="2">
        <animate attributeName="stroke" values="#ff3b3b;#ffb800;#ff3b3b" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" y="-3" font-family="Consolas,monospace" font-size="12" font-weight="bold" fill="#ffe8c2">SWITCH</text>
      <text text-anchor="middle" y="13" font-family="Consolas,monospace" font-size="9" fill="#a85a5a">core L2</text>
    </g>

    <!-- OXA-DC01 : EXPOSED -->
    <g transform="translate(230,160)">
      <rect x="-100" y="-56" width="200" height="118" rx="12" fill="#1a0909" stroke="url(#gAmber)" stroke-width="2" filter="url(#glowSm)">
        <animate attributeName="stroke-opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <circle cx="-84" cy="-42" r="4" fill="#ff3b3b"><animate attributeName="opacity" values="1;0.15;1" dur="0.7s" repeatCount="indefinite"/></circle>
      <text x="-72" y="-38" font-family="Consolas,monospace" font-size="9.5" fill="#ff6b6b" font-weight="bold">EXPOSED</text>
      <text text-anchor="middle" y="-14" font-family="Consolas,monospace" font-size="14" font-weight="bold" fill="#ffe8c2">OXA-DC01</text>
      <text text-anchor="middle" y="1" font-family="Consolas,monospace" font-size="9.5" fill="#d8a9a9">192.168.10.10</text>
      <text text-anchor="middle" y="17" font-family="Consolas,monospace" font-size="9" fill="#ffb800">⚠ SMBv1 · weak creds · Defender off</text>
      <text text-anchor="middle" y="30" font-family="Consolas,monospace" font-size="9" fill="#ffb800">⚠ anon FTP · share = Everyone</text>
      <text text-anchor="middle" y="43" font-family="Consolas,monospace" font-size="9" fill="#ffb800">⚠ firewall off · no lockout</text>
    </g>

    <!-- WIN10-CLIENT : unchanged -->
    <g transform="translate(670,160)">
      <rect x="-86" y="-40" width="172" height="80" rx="12" fill="#031a1f" stroke="url(#gBlue)" stroke-width="1.6" filter="url(#glowSm)"/>
      <circle cx="-70" cy="-26" r="4" fill="#00c8ff"><animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/></circle>
      <text x="-58" y="-22" font-family="Consolas,monospace" font-size="9.5" fill="#00c8ff">ONLINE</text>
      <text text-anchor="middle" y="2" font-family="Consolas,monospace" font-size="14" font-weight="bold" fill="#d7fbf5">WIN10-CLIENT</text>
      <text text-anchor="middle" y="18" font-family="Consolas,monospace" font-size="10" fill="#5a7a85">192.168.10.20 · unchanged</text>
    </g>

    <!-- KALI : targets acquired -->
    <g transform="translate(450,480)">
      <rect x="-100" y="-38" width="200" height="76" rx="12" fill="#1a0909" stroke="#ff3b3b" stroke-width="1.8" filter="url(#glowSm)">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <circle cx="-84" cy="-24" r="4" fill="#ff3b3b"><animate attributeName="opacity" values="1;0.1;1" dur="0.5s" repeatCount="indefinite"/></circle>
      <text x="-72" y="-20" font-family="Consolas,monospace" font-size="9.5" fill="#ff8a8a" font-weight="bold">TARGETS ACQUIRED</text>
      <text text-anchor="middle" y="2" font-family="Consolas,monospace" font-size="14" font-weight="bold" fill="#ffb3b3">KALI-ATK01</text>
      <text text-anchor="middle" y="18" font-family="Consolas,monospace" font-size="9.5" fill="#d89a9a">192.168.10.30 · armed for Day 03</text>
    </g>

    <!-- legend -->
    <g font-family="Consolas,monospace" font-size="10" fill="#a87070">
      <circle cx="30" cy="536" r="4" fill="#ff3b3b"/><text x="40" y="540">exposed / exploitable surface</text>
      <circle cx="260" cy="536" r="4" fill="#00c8ff"/><text x="270" y="540">unaffected node</text>
      <circle cx="430" cy="536" r="4" fill="#ffb800"/><text x="440" y="540">weakness flag</text>
    </g>

    <rect x="1" y="1" width="898" height="558" rx="13" fill="none" stroke="#ff3b3b" stroke-opacity="0.4" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
