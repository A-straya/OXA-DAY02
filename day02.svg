      <circle cx="54" cy="186" r="4" fill="#ff5f56"/><circle cx="68" cy="186" r="4" fill="#ffbd2e"/><circle cx="82" cy="186" r="4" fill="#27c93f"/>
      <g transform="translate(96,180)">
        <rect x="0" y="0" width="6.3" height="6.3" fill="url(#winBlue)"/><rect x="7.3" y="0" width="6.3" height="6.3" fill="url(#winBlue)"/>
        <rect x="0" y="7.3" width="6.3" height="6.3" fill="url(#winBlue)"/><rect x="7.3" y="7.3" width="6.3" height="6.3" fill="url(#winBlue)"/>
      </g>
      <text x="118" y="212" fill="#ffb800">
        <tspan fill="#ff8a8a">root@oxa</tspan><tspan fill="#5a7a85">:</tspan><tspan fill="#ffb800">~#</tspan>
        <tspan fill="#ffe8c2"> ./remove_hardening.sh --target=oxa-dc01 --force</tspan>
      </text>
      <rect x="570" y="200" width="9" height="14" fill="#ff3b3b"><animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="indefinite"/></rect>

      <text x="54" y="228" fill="#ff6b6b" font-size="12.5">
        [WARN] SMBv1 · weak creds · Defender OFF · anon FTP
        <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.25;0.4;0.8;0.85;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="54" y="228" fill="#ffb800" font-size="12.5">
        [DROP] Firewall · lockout policy · patch level
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.42;0.46;0.5;0.95;1" dur="4s" repeatCount="indefinite"/>
      </text>
    </g>

    <g transform="translate(740,188)">
      <rect x="0" y="0" width="140" height="48" rx="24" fill="#0b0505" stroke="url(#neonRed)" stroke-width="1.8">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="70" y="19" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#d8a9a9" letter-spacing="2">DAY</text>
      <text x="70" y="37" text-anchor="middle" font-family="Consolas,monospace" font-weight="bold" font-size="16" fill="url(#neonAmber)" filter="url(#glowA)">02 / HARDEN⁻¹</text>
