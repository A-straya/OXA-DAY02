<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0505"/><stop offset="55%" stop-color="#1f0a0a"/><stop offset="100%" stop-color="#0b0505"/>
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb800"/><stop offset="50%" stop-color="#ffd37a"/><stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b3b"/><stop offset="100%" stop-color="#ff7a7a"/>
    </linearGradient>
    <linearGradient id="winBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd8ff"/><stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <filter id="glowA" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowR" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="260" rx="14"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0505" stop-opacity="0"/><stop offset="100%" stop-color="#0b0505" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
