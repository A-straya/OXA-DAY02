    <rect width="900" height="90" y="170" fill="url(#fade)"/>
    <rect x="1" y="1" width="898" height="258" rx="13" fill="none" stroke="url(#neonRed)" stroke-opacity="0.4" stroke-width="2.4">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
