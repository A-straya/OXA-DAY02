      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <g stroke="#ff3b3b" stroke-width="1.1" opacity="0.4">
      <line x1="450" y1="150" x2="40"  y2="258"/><line x1="450" y1="150" x2="190" y2="258"/>
      <line x1="450" y1="150" x2="340" y2="258"/><line x1="450" y1="150" x2="450" y2="258"/>
      <line x1="450" y1="150" x2="560" y2="258"/><line x1="450" y1="150" x2="710" y2="258"/>
      <line x1="450" y1="150" x2="860" y2="258"/>
    </g>
    <g stroke="#ffb800" stroke-width="1" opacity="0.4">
