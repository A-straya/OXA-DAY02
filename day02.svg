      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </text>

    <circle cx="690" cy="37" r="5" fill="#ff3b3b" filter="url(#glowR)">
      <animate attributeName="opacity" values="1;0.1;1" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="702" y="41" font-family="Consolas,monospace" font-size="10.5" fill="#ff5c5c" letter-spacing="1.2">DEFENSE: DOWN</text>

    <g>
      <text x="36" y="118" font-family="'Courier New',monospace" font-weight="bold" font-size="66" fill="#00e5ff" letter-spacing="4" opacity="0">
        OXA
        <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.3;0.33;0.37;1" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="x" values="36;30;36" keyTimes="0;0.35;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
